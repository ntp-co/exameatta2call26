<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<title>ATTA-EXAME DE ADMISSAO 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#0A2A3D;
  --ink-2:#123A52;
  --blueline:#3E7C97;
  --blueline-soft:#B9D6E2;
  --paper:#F4EFE3;
  --paper-2:#EAE3D2;
  --accent:#E2622B;
  --accent-2:#C94F1E;
  --good:#3F7A52;
  --good-soft:#DCEBDF;
  --bad:#B23A2E;
  --bad-soft:#F4DEDA;
  --ink-soft:rgba(10,42,61,0.62);
  --radius:2px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:transparent;}
body{
  font-family:'IBM Plex Sans',sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:28px 16px 60px;
}
.app{
  width:100%;
  max-width:760px;
}
.disc{
  width:44px;height:44px;flex-shrink:0;
}
h1,h2,h3{
  font-family:'Space Grotesk',sans-serif;
  margin:0;
  letter-spacing:0.01em;
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--blueline);
  font-weight:600;
}
.topbar{
  display:flex;align-items:center;gap:12px;
  padding-bottom:18px;margin-bottom:22px;
  border-bottom:1px solid var(--blueline-soft);
}
.topbar .brand-text{font-size:13px;line-height:1.35;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.topbar .brand-text b{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:16px;display:block;}

.card{
  background:var(--paper);
  border:1px solid var(--blueline-soft);
  border-radius:var(--radius);
  padding:28px 26px;
  position:relative;
  box-shadow:0 1px 0 rgba(10,42,61,0.04);
}
.card + .card{margin-top:16px;}

/* grid watermark */
.grid-bg{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--blueline-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--blueline-soft) 1px, transparent 1px);
  background-size:26px 26px;
  opacity:0.28;
  pointer-events:none;
  border-radius:var(--radius);
}

/* LANDING */
.landing-hero{
  text-align:center;
  padding:34px 20px 10px;
}
.landing-hero h1{font-size:26px;line-height:1.25;margin-bottom:8px;}
.landing-hero p{color:var(--ink-soft);font-size:14.5px;max-width:480px;margin:0 auto;}
.meta-row{
  display:flex;justify-content:center;gap:22px;
  margin:22px 0 6px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;color:var(--ink-soft);
}
.meta-row span{display:flex;align-items:center;gap:6px;}
.meta-row b{color:var(--ink);}

label{
  display:block;font-size:12px;font-weight:600;
  color:var(--ink-soft);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:0.06em;
  font-family:'IBM Plex Mono',monospace;
}
input[type=text],input[type=email]{
  width:100%;padding:11px 12px;
  border:1px solid var(--blueline);
  background:#fff;border-radius:var(--radius);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14.5px;color:var(--ink);
  margin-bottom:16px;
}
input:focus{outline:2px solid var(--accent);outline-offset:1px;}

.btn{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;font-size:14.5px;
  padding:12px 22px;border-radius:var(--radius);
  border:1px solid var(--accent);
  background:var(--accent);color:#fff;
  cursor:pointer;letter-spacing:0.01em;
  transition:transform .12s ease, background .12s ease;
}
.btn:hover{background:var(--accent-2);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn.secondary{
  background:transparent;color:var(--ink);border-color:var(--blueline);
}
.btn.secondary:hover{background:var(--paper-2);}
.btn-row{display:flex;justify-content:space-between;gap:10px;margin-top:22px;}

.footlink{
  text-align:center;margin-top:18px;
  font-size:12px;color:var(--ink-soft);
}
.footlink a{color:var(--blueline);cursor:pointer;text-decoration:underline;}

/* EXAM HEADER */
.exam-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;flex-wrap:wrap;gap:10px;
}
.timer{
  font-family:'IBM Plex Mono',monospace;
  font-size:20px;font-weight:600;
  padding:6px 12px;border:1px solid var(--blueline);
  border-radius:var(--radius);background:#fff;
  letter-spacing:0.02em;
}
.timer.low{color:var(--bad);border-color:var(--bad);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.55;}}

.progress-track{
  display:flex;gap:4px;margin-bottom:6px;
}
.progress-dot{
  flex:1;height:5px;background:var(--paper-2);border-radius:2px;
}
.progress-dot.done{background:var(--blueline);}
.progress-dot.current{background:var(--accent);}

.section-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;color:var(--ink-soft);
  margin-bottom:20px;letter-spacing:0.04em;
}

.qnum{
  font-family:'IBM Plex Mono',monospace;
  color:var(--blueline);font-size:12px;font-weight:600;
  margin-bottom:8px;
}
.qtext{font-size:16.5px;font-weight:600;line-height:1.4;margin-bottom:18px;font-family:'Space Grotesk',sans-serif;}
.option{
  display:flex;align-items:flex-start;gap:11px;
  padding:11px 12px;border:1px solid var(--blueline-soft);
  border-radius:var(--radius);margin-bottom:8px;cursor:pointer;
  background:#fff;transition:border-color .1s ease, background .1s ease;
  font-size:14.5px;line-height:1.4;
}
.option:hover{border-color:var(--blueline);background:var(--paper-2);}
.option.selected{border-color:var(--accent);background:#FCEEE6;}
.option .letter{
  font-family:'IBM Plex Mono',monospace;font-weight:600;
  color:var(--blueline);flex-shrink:0;
}
.option.selected .letter{color:var(--accent);}

/* RESULTS */
.stamp-wrap{display:flex;justify-content:center;margin:8px 0 18px;}
.stamp{
  width:150px;height:150px;
}
.result-headline{text-align:center;}
.result-headline .status{
  font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:24px;letter-spacing:0.02em;
}
.status.approved{color:var(--good);}
.status.reproved{color:var(--bad);}
.result-headline .pct{
  font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--ink-soft);margin-top:4px;
}
.bars{margin-top:26px;}
.bar-row{margin-bottom:14px;}
.bar-row .bl{
  display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;
  font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);
}
.bar-track{height:9px;background:var(--paper-2);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;background:var(--blueline);}
.bar-fill.low{background:var(--bad);}
.bar-fill.ok{background:var(--good);}

/* ADMIN */
.admin-gate{max-width:340px;margin:60px auto;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px;}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--blueline-soft);}
th{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.05em;}
td.mono{font-family:'IBM Plex Mono',monospace;}
.pill{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:10px;display:inline-block;
}
.pill.approved{background:var(--good-soft);color:var(--good);}
.pill.reproved{background:var(--bad-soft);color:var(--bad);}

.loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.empty{text-align:center;padding:40px 0;color:var(--ink-soft);font-size:14px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(10,42,61,0.55);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:1000;
}
.modal-box{
  background:var(--paper);border:1px solid var(--blueline-soft);
  border-radius:var(--radius);padding:22px;width:100%;max-width:640px;
  box-shadow:0 10px 30px rgba(10,42,61,0.25);
}
.csv-textarea{
  width:100%;height:180px;font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;padding:10px;border:1px solid var(--blueline);
  border-radius:var(--radius);resize:vertical;background:#fff;color:var(--ink);
}

.select-input{
  width:100%;padding:11px 12px;
  border:1px solid var(--blueline);
  background:#fff;border-radius:var(--radius);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14.5px;color:var(--ink);
  margin-bottom:8px;
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src = "assects/js/script.js"> </script>
</body>
</html>
